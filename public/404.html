<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 – Not Found | Ferrox</title>
  <style>
    :root {
      --bg:        #f9fafb;
      --text:      #1f2937;
      --muted:     #6b7280;
      --border:    #d1d5db;
      --link:      #374151;
      --link-hover:#111827;
    }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1.6;
    }

    .content {
      max-width: 520px;
      padding: 2rem 1.5rem;
    }

    h1 {
      font-size: 6.5rem;
      font-weight: 800;
      margin: 0 0 0.5rem;
      letter-spacing: -0.05em;
      color: #374151;
    }

    h2 {
      font-size: 1.75rem;
      font-weight: 600;
      margin: 0.25rem 0 1.25rem;
      color: var(--text);
    }

    p {
      font-size: 1.125rem;
      color: var(--muted);
      margin: 0 0 1.75rem;
    }

    a {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: var(--link);
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 500;
      transition: background 0.15s ease;
    }

    a:hover,
    a:focus {
      background: var(--link-hover);
      outline: none;
    }

    footer {
      margin-top: 5rem;
      font-size: 0.875rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="content">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>
      The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
    </p>
    <a href="/">Back to Home</a>
  </div>

  <footer>
    Ferrox • Lightweight Rust HTTP server
  </footer>
</body>
</html>
